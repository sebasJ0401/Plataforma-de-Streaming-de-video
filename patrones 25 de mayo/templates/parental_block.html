{% extends "base.html" %}

{% block content %}
<div style="
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    padding: 2rem;
">
    <div style="
        background: #1a1a2e;
        border: 2px solid #e94560;
        border-radius: 16px;
        padding: 3rem 4rem;
        max-width: 500px;
        width: 100%;
    ">
        <div style="font-size: 4rem; margin-bottom: 1rem;">🔒</div>

        <h2 style="color: #e94560; margin-bottom: 0.5rem;">Contenido bloqueado</h2>

        <p style="color: #aaa; margin-bottom: 1rem;">
            {{ label }}
        </p>

        <p style="color: #666; font-size: 0.9rem; margin-bottom: 2rem;">
            El control parental está activo y este video no está permitido.
        </p>

        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="{{ url_for('browse') }}" style="
                background: #e94560;
                color: white;
                padding: 0.75rem 1.5rem;
                border-radius: 8px;
                text-decoration: none;
                font-weight: 600;
            ">← Volver al catálogo</a>

            <button onclick="desactivarControl()" style="
                background: transparent;
                color: #aaa;
                border: 1px solid #444;
                padding: 0.75rem 1.5rem;
                border-radius: 8px;
                cursor: pointer;
                font-weight: 600;
            ">Desactivar control parental</button>
        </div>
    </div>
</div>

<script>
async function desactivarControl() {
    const pin = prompt('Ingresa tu PIN para desactivar el control parental:');
    if (!pin) return;

    const res = await fetch('/api/parental', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin })
    });
    const data = await res.json();

    if (data.success && !data.parental_active) {
        alert('✅ Control parental desactivado. Recarga la página.');
        location.reload();
    } else {
        alert('❌ PIN incorrecto o error al desactivar.');
    }
}
</script>
{% endblock %}
